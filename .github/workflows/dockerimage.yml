name: Test Docker image

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 1.16
          - 1.16-3.13
          - 1.17
          - 1.17-3.13
          - 1.18
          - 1.18-nofaccessat2
          - 1.19
          - 1.19-nofaccessat2
          - "1.20"
          - 1.20-nofaccessat2
          - 1.21
          - 1.21-nofaccessat2
          - 1.22
          - 1.22-nofaccessat2
          - 1.23
          - 1.23-nofaccessat2
          - 1.24
          - 1.24-nofaccessat2
          - 1.25
          - 1.25-nofaccessat2
          - 1.26
          - 1.26-nofaccessat2
          - 1.27
          - 1.27-nofaccessat2

    steps:
      - uses: actions/checkout@v6
      - name: Build the Docker image
        run: docker build --tag golang-alpine-test "${{ matrix.image }}"
      - name: Test the Docker image
        run: |
          docker run --rm -i golang-alpine-test /bin/sh -c '
            go version &&
            bash --version &&
            make --version &&
            git --version &&
            gcc --version &&
            jq --version &&
            curl --version &&
            air -v &&
            dlv version &&
            go-junit-report -version &&
            dumb-init --version &&
            merge-junit --version
          '
      - name: Test gocov
        if: ${{ !startsWith(matrix.image, '1.25') && !startsWith(matrix.image, '1.26') && !startsWith(matrix.image, '1.27') }}
        run: docker run --rm golang-alpine-test /bin/sh -c 'command -v gocov'
